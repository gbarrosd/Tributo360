{% extends "web/base.html" %}
{% block titulo %}Simulações{% endblock %}
{% block conteudo %}
<h1 class="h4 mb-3">Histórico de simulações</h1>
<form class="row g-2 mb-3" method="get">
  <div class="col-md-4">
    <select class="form-select" name="empresa">
      <option value="">Todas as empresas</option>
      {% for e in empresas %}<option value="{{ e.pk }}" {% if empresa_id == e.pk|stringformat:"s" %}selected{% endif %}>{{ e.razao_social }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <select class="form-select" name="tipo">
      <option value="">Regular e Simples</option>
      <option value="regular" {% if tipo == "regular" %}selected{% endif %}>Regime regular</option>
      <option value="simples" {% if tipo == "simples" %}selected{% endif %}>Simples Nacional</option>
    </select>
  </div>
  <div class="col-md-3"><input class="form-control" name="q" value="{{ busca }}" placeholder="Nome do cenário"></div>
  <div class="col-auto"><button class="btn btn-outline-secondary">Filtrar</button></div>
</form>
<form method="get" action="{% url 'web:comparar' %}" data-max-comparacao="{{ max_comparacao }}" id="form-comparar">
  <div class="d-flex align-items-center gap-2 mb-2">
    <button class="btn btn-primary btn-sm" id="botao-comparar" disabled>Comparar selecionadas</button>
    <span class="small text-body-secondary">Marque de 2 a {{ max_comparacao }} simulações.</span>
  </div>
  <div class="card">{% include "web/simulacoes/_tabela.html" with selecionar=True %}</div>
</form>
{% endblock %}
