{% load tributo %}{% if campo.field.widget.input_type == "checkbox" %}
<div class="form-check {{ classe|default:'mb-3' }}">
  {{ campo|bs }}
  <label class="form-check-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {% for erro in campo.errors %}<div class="invalid-feedback d-block">{{ erro }}</div>{% endfor %}
</div>
{% else %}
<div class="{{ classe|default:'mb-3' }}">
  <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {{ campo|bs }}
  {% for erro in campo.errors %}<div class="invalid-feedback">{{ erro }}</div>{% endfor %}
  {% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
</div>
{% endif %}
