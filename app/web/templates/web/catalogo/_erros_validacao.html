{% for erro in item.erros_validacao %}
<div class="mt-0.5 text-xs text-erro">{% if erro.codigo %}<span class="font-mono">{{ erro.codigo }}</span> {% endif %}{% if erro.campo %}<strong>{{ erro.campo }}</strong>: {% endif %}{{ erro.mensagem }}
  <span class="text-suave">({{ erro.origem }})</span></div>
{% endfor %}
{% for aviso in item.validacao.avisos %}<div class="mt-0.5 text-xs text-suave">{{ aviso }}</div>{% endfor %}
