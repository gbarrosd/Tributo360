name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tributo360
          POSTGRES_USER: tributo360
          POSTGRES_PASSWORD: tributo360
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tributo360" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: localhost
      POSTGRES_DB: tributo360
      POSTGRES_USER: tributo360
      POSTGRES_PASSWORD: tributo360
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: CSS do Tailwind e vendor em dia com os templates
        working-directory: app/frontend
        run: npm ci && npm run build && git diff --exit-code -- ../static
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations em dia
        run: python manage.py makemigrations --check --dry-run
      - name: Testes (inclui suíte cross-tenant e teste de arquitetura)
        run: pytest

  # Testes de contrato: clientes do Django contra os motores reais, nas tags fixadas nos submódulos.
  # Roda em todo push/PR e, por consequência, em toda troca de tag de motor (planejamento, seção 6).
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tributo360
          POSTGRES_USER: tributo360
          POSTGRES_PASSWORD: tributo360
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tributo360" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: localhost
      POSTGRES_DB: tributo360
      POSTGRES_USER: tributo360
      POSTGRES_PASSWORD: tributo360
      MOTORES_CONTRATO: "1"
      MOTOR_REGIME_REGULAR_URL: http://localhost:18080
      MOTOR_SIMPLES_URL: http://localhost:18082
      MOTOR_DANFSE_URL: http://localhost:18090
      MOTOR_DANFSE_VERSAO: "1.0.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Subir os motores
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.contrato.yml up -d --build --wait --wait-timeout 600 \
            motor-regime-regular motor-simples motor-danfse
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: app
      - name: Testes de contrato
        run: pytest -m contrato -v
        working-directory: app
      - name: Logs dos motores (em caso de falha)
        if: failure()
        run: docker compose logs --no-color motor-regime-regular motor-simples motor-danfse | tail -n 300
