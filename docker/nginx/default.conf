# Proxy reverso na frente do Django. TLS (Let's Encrypt) entra na configuração da VPS de produção.
upstream django {
    server django:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;  # lotes de XML (Fase 4)

    location /static/ {
        alias /srv/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
